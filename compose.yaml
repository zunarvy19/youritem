x-app: &app
  image: youritem-dev
  build:
    context: .
  working_dir: /app
  volumes:
    - .:/app
    - ./.env.docker:/app/.env:ro
    - vendor:/app/vendor
    - node_modules:/app/node_modules
  environment: &app-environment
    APP_NAME: YourItem
    APP_ENV: local
    APP_KEY: base64:eW91cml0ZW0tbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: youritem
    DB_USERNAME: youritem
    DB_PASSWORD: youritem
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:8000,127.0.0.1:8000,localhost
    VITE_BACKEND_URL: http://app:8000
    VITE_DEV_SERVER_URL: http://localhost:5173
    VITE_HMR_HOST: localhost
  depends_on:
    db:
      condition: service_healthy

services:
  setup:
    <<: *app
    command: >-
      sh -lc "composer install --no-interaction --prefer-dist
      && npm ci
      && php artisan migrate --force
      && php artisan db:seed --force"
    restart: "no"

  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  queue:
    <<: *app
    command: php artisan queue:work --tries=1
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  vite:
    <<: *app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: youritem
      POSTGRES_USER: youritem
      POSTGRES_PASSWORD: youritem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youritem -d youritem"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
  vendor:
